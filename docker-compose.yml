name: inno

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-admin}
    ports:
      - "5435:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inno

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-admin}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - inno

  keycloak-init:
    image: quay.io/keycloak/keycloak:latest
    depends_on:
      keycloak:
        condition: service_started
    environment:
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-inno-realm}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-dotnet-auth-service}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
    entrypoint: ["/bin/bash", "/init-realm.sh"]
    volumes:
      - ./keycloak/init-realm.sh:/init-realm.sh:ro
    networks:
      - inno
    restart: "no"

  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    restart: on-failure:5
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inno

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: on-failure:5
    environment:
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    depends_on:
      sonarqube-db:
        condition: service_healthy
    networks:
      - inno

  logs-db:
    image: mongo:7
    container_name: logs-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-logs}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-logs}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-logs}
    ports:
      - "27017:27017"
    volumes:
      - logs_db_data:/data/db
    networks:
      - inno

  facility-db:
    image: postgres:16-alpine
    container_name: facility-db
    environment:
      POSTGRES_DB: ${FACILITY_DB:-facility}
      POSTGRES_USER: ${FACILITY_DB_USER:-facility}
      POSTGRES_PASSWORD: ${FACILITY_DB_PASSWORD:-facility}
    ports:
      - "5434:5432"
    volumes:
      - facility_db_data:/var/lib/postgresql/data
      - ../InnoFacilityApi/FacilityApi/FacilityApi.Infrastructure/Scripts/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FACILITY_DB_USER:-facility} -d ${FACILITY_DB:-facility}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inno

  profiles-db:
    image: postgres:16-alpine
    container_name: profiles-db
    environment:
      POSTGRES_DB: ${PROFILES_DB:-profiles}
      POSTGRES_USER: ${PROFILES_DB_USER:-profiles}
      POSTGRES_PASSWORD: ${PROFILES_DB_PASSWORD:-profiles}
    ports:
      - "5433:5432"
    volumes:
      - profiles_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROFILES_DB_USER:-profiles} -d ${PROFILES_DB:-profiles}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inno

  profiles-migrator:
    build:
      context: ../InnoProfilesApi/ProfilesApi
      dockerfile: Dockerfile
      target: migrate
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProfilesDb: Host=profiles-db;Port=5432;Database=${PROFILES_DB:-profiles};Username=${PROFILES_DB_USER:-profiles};Password=${PROFILES_DB_PASSWORD:-profiles}
    depends_on:
      profiles-db:
        condition: service_healthy
    networks:
      - inno

  auth-api:
    build:
      context: ../InnoAuthApi/AuthApi
      dockerfile: Dockerfile
    container_name: auth-api
    ports:
      - "5119:5119"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Keycloak__BaseUrl: http://localhost:8080
      Keycloak__Realm: ${KEYCLOAK_REALM:-inno-realm}
      Keycloak__ClientId: ${KEYCLOAK_CLIENT_ID:-dotnet-auth-service}
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET:-}
      Keycloak__Audience: dotnet-auth-service
      Keycloak__RedirectUri: http://localhost:5119/Auth/callback
      Keycloak__PostLoginRedirectUri: http://localhost:5173/
      Keycloak__RequireHttpsMetadata: "false"
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
    networks:
      - inno

  profiles-api:
    build:
      context: ../InnoProfilesApi/ProfilesApi
      dockerfile: Dockerfile
    container_name: profiles-api
    ports:
      - "5082:5082"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProfilesDb: Host=profiles-db;Port=5432;Database=${PROFILES_DB:-profiles};Username=${PROFILES_DB_USER:-profiles};Password=${PROFILES_DB_PASSWORD:-profiles}
      AuthApi__BaseUrl: http://auth-api:5119
      Keycloak__BaseUrl: http://localhost:8080
      Keycloak__Realm: ${KEYCLOAK_REALM:-inno-realm}
      Keycloak__Audience: dotnet-auth-service
      Keycloak__RequireHttpsMetadata: "false"
    depends_on:
      profiles-migrator:
        condition: service_completed_successfully
      auth-api:
        condition: service_started
    networks:
      - inno

  facility-api:
    build:
      context: ../InnoFacilityApi/FacilityApi
      dockerfile: Dockerfile
    container_name: facility-api
    ports:
      - "5035:5035"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FacilityDb: Host=facility-db;Port=5432;Database=${FACILITY_DB:-facility};Username=${FACILITY_DB_USER:-facility};Password=${FACILITY_DB_PASSWORD:-facility}
      Keycloak__BaseUrl: http://localhost:8080
      Keycloak__Realm: ${KEYCLOAK_REALM:-inno-realm}
      Keycloak__Audience: dotnet-auth-service
      Keycloak__RequireHttpsMetadata: "false"
    depends_on:
      facility-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - inno

  inno-ui:
    build:
      context: ../InnoUI/inno-ui
      dockerfile: Dockerfile
      args:
        VITE_AUTH_API_URL: http://localhost:5119
        VITE_PROFILES_API_URL: http://localhost:5082
    container_name: inno-ui
    ports:
      - "5173:80"
    depends_on:
      - auth-api
      - profiles-api
      - facility-api
    networks:
      - inno

volumes:
  keycloak_db_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  profiles_db_data:
  facility_db_data:
  logs_db_data:

networks:
  inno:
    name: inno
