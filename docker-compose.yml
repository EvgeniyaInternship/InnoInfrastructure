name: inno

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inno

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_BASE_URL}
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - inno

  keycloak-init:
    image: quay.io/keycloak/keycloak:latest
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    entrypoint: ["/bin/bash", "/init-realm.sh"]
    volumes:
      - ./keycloak/init-realm.sh:/init-realm.sh:ro
    networks:
      - inno
    restart: "no"

  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    restart: on-failure:5
    environment:
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: ${SONAR_DB}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER} -d ${SONAR_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inno

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: on-failure:5
    environment:
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    depends_on:
      sonarqube-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - inno

  logs-db:
    image: mongo:7
    container_name: logs-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - logs_db_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)\""]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 20s
    networks:
      - inno

  facility-db:
    image: postgres:16-alpine
    container_name: facility-db
    environment:
      POSTGRES_DB: ${FACILITY_DB}
      POSTGRES_USER: ${FACILITY_DB_USER}
      POSTGRES_PASSWORD: ${FACILITY_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - facility_db_data:/var/lib/postgresql/data
      - ../InnoFacilityApi/FacilityApi/FacilityApi.Infrastructure/Scripts/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FACILITY_DB_USER} -d ${FACILITY_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inno

  profiles-db:
    image: postgres:16-alpine
    container_name: profiles-db
    environment:
      POSTGRES_DB: ${PROFILES_DB}
      POSTGRES_USER: ${PROFILES_DB_USER}
      POSTGRES_PASSWORD: ${PROFILES_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - profiles_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROFILES_DB_USER} -d ${PROFILES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inno

  profiles-migrator:
    build:
      context: ../InnoProfilesApi/ProfilesApi
      dockerfile: Dockerfile
      target: migrate
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProfilesDb: Host=profiles-db;Port=5432;Database=${PROFILES_DB};Username=${PROFILES_DB_USER};Password=${PROFILES_DB_PASSWORD}
    depends_on:
      profiles-db:
        condition: service_healthy
    networks:
      - inno

  auth-api:
    build:
      context: ../InnoAuthApi/AuthApi
      dockerfile: Dockerfile
    container_name: auth-api
    ports:
      - "5119:5119"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Keycloak__BaseUrl: ${KEYCLOAK_BASE_URL}
      Keycloak__Realm: ${KEYCLOAK_REALM}
      Keycloak__ClientId: ${KEYCLOAK_CLIENT_ID}
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET}
      Keycloak__Audience: ${KEYCLOAK_CLIENT_ID}
      Keycloak__RedirectUri: ${AUTH_API_URL}/Auth/callback
      Keycloak__PostLoginRedirectUri: ${UI_URL}/
      Keycloak__RequireHttpsMetadata: "false"
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "socat -u OPEN:/dev/null TCP:127.0.0.1:5119,connect-timeout=3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - inno

  profiles-api:
    build:
      context: ../InnoProfilesApi/ProfilesApi
      dockerfile: Dockerfile
    container_name: profiles-api
    ports:
      - "5082:5082"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProfilesDb: Host=profiles-db;Port=5432;Database=${PROFILES_DB};Username=${PROFILES_DB_USER};Password=${PROFILES_DB_PASSWORD}
      AuthApi__BaseUrl: ${AUTH_API_INTERNAL_URL}
      Keycloak__BaseUrl: ${KEYCLOAK_BASE_URL}
      Keycloak__Realm: ${KEYCLOAK_REALM}
      Keycloak__Audience: ${KEYCLOAK_CLIENT_ID}
      Keycloak__RequireHttpsMetadata: "false"
    depends_on:
      profiles-migrator:
        condition: service_completed_successfully
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "socat -u OPEN:/dev/null TCP:127.0.0.1:5082,connect-timeout=3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - inno

  facility-api:
    build:
      context: ../InnoFacilityApi/FacilityApi
      dockerfile: Dockerfile
    container_name: facility-api
    ports:
      - "5035:5035"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FacilityDb: Host=facility-db;Port=5432;Database=${FACILITY_DB};Username=${FACILITY_DB_USER};Password=${FACILITY_DB_PASSWORD}
      Keycloak__BaseUrl: ${KEYCLOAK_BASE_URL}
      Keycloak__Realm: ${KEYCLOAK_REALM}
      Keycloak__Audience: ${KEYCLOAK_CLIENT_ID}
      Keycloak__RequireHttpsMetadata: "false"
    depends_on:
      facility-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "socat -u OPEN:/dev/null TCP:127.0.0.1:5035,connect-timeout=3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - inno

  inno-ui:
    build:
      context: ../InnoUI/inno-ui
      dockerfile: Dockerfile
      args:
        VITE_AUTH_API_URL: ${AUTH_API_URL}
        VITE_PROFILES_API_URL: ${PROFILES_API_URL}
    container_name: inno-ui
    ports:
      - "5173:80"
    depends_on:
      auth-api:
        condition: service_healthy
      profiles-api:
        condition: service_healthy
      facility-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - inno

volumes:
  keycloak_db_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  profiles_db_data:
  facility_db_data:
  logs_db_data:

networks:
  inno:
    name: inno
